name: Daily Folklore Generation
permissions:
  contents: write
on:
  schedule:
    # This runs at 07:00 UTC every day
    # Midnight (12:00 AM) in Albuquerque
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas google-generativeai openpyxl

      - name: Run script
        env:
          # We store the API key securely in GitHub Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: ./exp/storygen
        run: python storygen.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated daily story update" || echo "No changes to commit"
          git push
