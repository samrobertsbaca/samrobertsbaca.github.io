name: Daily Chance Album
# each day: listen to the world's radio over the course of the day, about fifteen moments every hour; in the
# evening make an album from all of it by chance (numbered 000, 001 ...; any day may be the last), leave it
# waiting as a hidden draft release, and at midnight mountain time release it and point scorsby.us/exp/chance/
# at it.
#
# an album's day of listening runs from 9 pm two nights before its release to 8 pm the night before: each
# hour's clips are kept as an artifact (radio-DAY-HH, DAY being the album's day), with a note of who was
# visited (listened-DAY-HH), so each receiver and microphone is visited at most once a day. at 9 pm the
# day's clips are gathered up, the album is made, and the artifacts are let go.
#
# the timing comes from a small Cloudflare worker (chance-trigger/), which keeps time to the minute: every
# hour it asks for that hour's listening (mode: gather), at 9 pm for the album to be made (mode: compose),
# at midnight for it to be released (mode: release). GitHub's own schedule, below, is the backup: at 41
# minutes past every hour it listens if that hour hasn't been; from 9 pm it makes sure tomorrow's album
# exists and releases it at midnight itself; and any time of day it releases or makes an album that's late.
# an hour that fails is made up the next hour; and whatever happens, the album is made from whatever was
# gathered (with a quick fresh listen if almost nothing was).
concurrency:
  # one run at a time; a run waiting its turn finds the work done, and stops. the hours' listening has a
  # line of its own: it is short, and so never waits behind (or is dropped behind) an album waiting for midnight
  group: ${{ (github.event.inputs.mode == 'gather' || github.event.schedule == '41 * * * *') && 'daily-chance-gather' || 'daily-chance' }}
  cancel-in-progress: false
permissions:
  contents: write
  actions: write   # to find and let go of the day's clips, and, when chance ends the series, to switch off
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "gather (an hour's listening), compose (the album, a draft for midnight), release (the waiting draft), or both (compose and release)"
        type: choice
        options: [both, gather, compose, release]
        default: both
      day:
        description: "the album's day, YYYY-MM-DD in mountain time (blank: as the clock says)"
        required: false
        default: ''
      hour:
        description: "gather: the mountain-time hour (0-23) the listening is for (blank: now)"
        required: false
        default: ''
  schedule:
    # the backup for the hours' listening: every hour, in case the worker's run didn't come
    - cron: '41 * * * *'
    # the backup for the album: in the evening (UTC times: 9-10:30 pm mountain daylight time, 8-9:30 pm
    # standard), more than once, as GitHub drops scheduled runs when it's busy; and every hour, to catch up
    # if everything was lost
    - cron: '5 3 * * *'
    - cron: '35 3 * * *'
    - cron: '5 4 * * *'
    - cron: '35 4 * * *'
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/daily_chance.yml'] # and once whenever this file changes

jobs:
  # what's to be done, for which day (and hour)? nothing, if it's done already.
  decide:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.d.outputs.action }}
      day: ${{ steps.d.outputs.day }}
      hour: ${{ steps.d.outputs.hour }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: What's to be done?
        id: d
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          MODE: ${{ github.event.inputs.mode }}
          DAY: ${{ github.event.inputs.day }}
          HOUR: ${{ github.event.inputs.hour }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --depth 1 origin main
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime, json, os, subprocess, sys
          from zoneinfo import ZoneInfo
          CLOSE = 21                                                  # 9 pm: the day's listening ends, the album is made
          now = datetime.datetime.now(ZoneInfo('America/Denver'))     # mountain time, daylight or standard
          today = now.date().isoformat()
          tomorrow = (now.date() + datetime.timedelta(days=1)).isoformat()
          # the album this hour's listening is for: tomorrow's, or from 9 pm the one after
          listening_for = (now.date() + datetime.timedelta(days=1 if now.hour < CLOSE else 2)).isoformat()
          repo = os.environ['GITHUB_REPOSITORY']
          shown = subprocess.run(['git', 'show', 'origin/main:exp/chance/album.json'], capture_output=True, text=True).stdout
          try:
              released = json.loads(shown or '{}').get('day')          # the day of the album now on the page
          except ValueError:
              released = None
          finished = subprocess.run(['git', 'cat-file', '-e', 'origin/main:exp/chance/engine/FINISHED'],
                                    capture_output=True).returncode == 0
          rels = subprocess.run(['gh', 'api', f"repos/{repo}/releases?per_page=30"],
                                capture_output=True, text=True).stdout
          drafts = [r['tag_name'] for r in json.loads(rels or '[]') if r.get('draft')]
          waiting = lambda d: any(t.startswith(f'chance-{d}') for t in drafts)   # made, not yet released
          def kept(d, h):                                             # that hour's listening is done already
              r = subprocess.run(['gh', 'api', f"repos/{repo}/actions/artifacts?name=radio-{d}-{h:02d}"],
                                 capture_output=True, text=True).stdout
              return any(not a.get('expired') for a in json.loads(r or '{}').get('artifacts', []))
          event, cron = os.environ['EVENT'], os.environ.get('CRON') or ''
          mode, day, hour = os.environ.get('MODE') or 'both', os.environ.get('DAY') or '', os.environ.get('HOUR') or ''
          action = 'none'
          # whatever asks, the day must be a real date, the hour one of the day's, and the mode one of the four:
          # nothing else gets through
          try:
              day = datetime.date.fromisoformat(day).isoformat() if day else ''
          except ValueError:
              print(f"not a day: {day!r}", file=sys.stderr)
              finished, day = True, ''
          if hour and not (hour.isdigit() and 0 <= int(hour) <= 23):
              print(f"not an hour: {hour!r}", file=sys.stderr)
              finished, hour = True, ''
          hour = int(hour) if hour else now.hour
          if mode not in ('gather', 'compose', 'release', 'both'):
              print(f"not a mode: {mode!r}", file=sys.stderr)
              finished = True
          if finished:
              print("chance has ended the series, or the request made no sense: nothing to do", file=sys.stderr)
          elif event == 'workflow_dispatch':                   # the cloudflare worker, or a run by hand
              if mode == 'gather':
                  day = day or listening_for
                  action = 'none' if released == day or waiting(day) or kept(day, hour) else 'gather'
              elif mode == 'compose':
                  day = day or tomorrow
                  action = 'none' if released == day or waiting(day) else 'compose'
              elif mode == 'release':
                  day = day or today
                  action = 'none' if released == day else ('release' if waiting(day) else 'both')
              else:
                  day = day or (tomorrow if now.hour >= CLOSE else today)
                  action = 'none' if released == day else ('release' if waiting(day) else 'both')
          elif cron == '41 * * * *':                           # the backup for this hour's listening
              day, hour = listening_for, now.hour
              action = 'none' if released == day or waiting(day) or kept(day, hour) else 'gather'
          else:                                                # GitHub's schedule: the backup for the album
              if released != today:                            # today's album is late: release or make it now
                  day, action = today, ('release' if waiting(today) else 'both')
              elif now.hour >= CLOSE:                          # see tomorrow's album out at midnight, made or not
                  day, action = tomorrow, ('release' if waiting(tomorrow) else 'both')
          print(f"it is {now:%Y-%m-%d %H:%M} mountain time ({event} {cron}, {mode}); the album on the page is for "
                f"{released}; waiting as drafts: {drafts or 'none'} -> {action} {day}"
                + (f" (hour {hour})" if action == 'gather' else ''), file=sys.stderr)
          print(f"action={action}")
          print(f"day={day}")
          print(f"hour={hour:02d}")
          EOF

  # an hour's listening: about fifteen moments of the world's radio (365 over the day: the first five hours
  # of it, from 9 pm, take sixteen), plus any an earlier hour missed (up to sixty in all, so it stays short),
  # kept as an artifact for the evening. each shortwave receiver and each
  # open microphone is visited at most once a day (the day's note of who was visited travels with it); the
  # station streams make up whatever the others can't give. on a pure day (about one in seven, decided by
  # chance at the day's first hour) the dial is turned anywhere, with no listening first, and everything is kept
  gather:
    needs: decide
    if: needs.decide.outputs.action == 'gather'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHANCE_DAY: ${{ needs.decide.outputs.day }}
      CHANCE_HOUR: ${{ needs.decide.outputs.hour }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg and libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -q numpy websocket-client

      - name: Who was visited today
        working-directory: exp/chance/engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/listened"
          PURE=$(python day_radio.py state "$CHANCE_DAY" "$RUNNER_TEMP/listened/today.json")
          echo "CHANCE_PURE=$PURE" >> "$GITHUB_ENV"
          echo "pure day: $PURE"

      - name: Listen
        working-directory: exp/chance/engine
        timeout-minutes: 30
        run: |
          # this hour's share, and whatever the hours before it missed (up to sixty in all, to stay short)
          N=$(python - <<'EOF'
          import json, os
          slot = (int(os.environ['CHANCE_HOUR']) - 21) % 24                 # hours since the day began, at 9 pm
          share = lambda s: 15 + (s < 5)
          due = sum(share(s) for s in range(slot + 1))
          have = int(json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'listened', 'today.json'))).get('clips') or 0)
          print(min(60, max(share(slot), due - have)))
          EOF
          )
          if [ "$CHANCE_PURE" = "1" ]; then DIAL=wild; else DIAL=stations; fi
          echo "listening for $N moments, for the album of $CHANCE_DAY"
          python chance_fontana.py --gather "$N" --gather-only --workers 8 --dial "$DIAL" \
            --visited "$RUNNER_TEMP/listened/today.json" || echo "this hour fell short; making do"

      - name: Keep this hour's clips
        uses: actions/upload-artifact@v4
        with:
          name: radio-${{ needs.decide.outputs.day }}-${{ needs.decide.outputs.hour }}
          path: |
            exp/chance/engine/radio_cache/*.wav
            exp/chance/engine/radio_cache/*Z_*.json
          retention-days: 2
          if-no-files-found: warn

      - name: Keep who was visited
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listened-${{ needs.decide.outputs.day }}-${{ needs.decide.outputs.hour }}
          path: ${{ runner.temp }}/listened/today.json
          retention-days: 2
          if-no-files-found: ignore

  album:
    needs: decide
    if: needs.decide.outputs.action == 'compose' || needs.decide.outputs.action == 'release' || needs.decide.outputs.action == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MAKE: ${{ needs.decide.outputs.action == 'compose' || needs.decide.outputs.action == 'both' }}
      RELEASE: ${{ needs.decide.outputs.action == 'release' || needs.decide.outputs.action == 'both' }}
      CHANCE_DAY: ${{ needs.decide.outputs.day }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg and libraries
        if: env.MAKE == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -q numpy pillow websocket-client

      # every hour's clips (thrown away when the job ends). if almost nothing came (the hours were lost),
      # a quick fresh listen makes up the day's 365 now
      - name: Gather up the day's radio
        if: env.MAKE == 'true'
        working-directory: exp/chance/engine
        timeout-minutes: 120
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/listened"
          PURE=$(python day_radio.py state "$CHANCE_DAY" "$RUNNER_TEMP/listened/today.json")
          echo "CHANCE_PURE=$PURE" >> "$GITHUB_ENV"
          GOT=$(python day_radio.py radio "$CHANCE_DAY" radio_cache)
          echo "$GOT moments of radio gathered over the day (pure day: $PURE)"
          if [ "$GOT" -lt 120 ]; then
            if [ "$PURE" = "1" ]; then DIAL=wild; else DIAL=stations; fi
            CHANCE_PURE=$PURE python chance_fontana.py --gather $((365 - GOT)) --gather-only --workers 8 --dial "$DIAL" \
              --visited "$RUNNER_TEMP/listened/today.json" || echo "gathering fell short; making do"
          fi

      - name: Make the album
        if: env.MAKE == 'true'
        working-directory: exp/chance/engine
        # mostly 5-7 songs; now and then more, up to 12 (about once a month). each song draws on a
        # palette of the day's clips, as few as 3 that belong together; how many it may gather is the
        # album's own draw: up to 8 most days, up to 20 sometimes, up to 60 now and then, and once in a
        # while up to 180, so a song of a few close sounds can sit beside a collage of the whole day.
        # a pure day keeps the static, uses no palette (every clip may sit by any other), and follows
        # only the Fontana-style score.
        run: |
          N=$(python -c "import random; print(random.choices(range(5, 13), weights=[26, 28, 24, 9, 5, 3, 2, 3])[0])")
          PAL=$(python -c "import random; print(random.choices(['3-8', '3-20', '3-60', '3-180'], weights=[55, 25, 13, 7])[0])")
          echo "$N songs, palettes of $PAL clips"
          if [ "$CHANCE_PURE" = "1" ]; then EXTRA="--form fontana --keep-static"; else EXTRA=""; fi
          python chance_fontana.py -n "$N" --palette-size "$PAL" $EXTRA -o "$RUNNER_TEMP/albums"

      # it waits, unheard, as a draft release until midnight
      - name: Leave it waiting as a draft
        if: env.MAKE == 'true'
        working-directory: exp/chance/engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_album.py --albums "$RUNNER_TEMP/albums" --stage

      - name: Commit the album number
        if: env.MAKE == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add exp/chance/engine/titles.txt exp/chance/engine/album_number.txt
          git commit -m "Daily chance album made (waiting for midnight)" || echo "No changes to commit"
          git pull --rebase
          git push

      # the album is made: the day's recordings are let go
      - name: Let go of the day's clips
        if: env.MAKE == 'true'
        working-directory: exp/chance/engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: python day_radio.py forget "$CHANCE_DAY" || echo "some clips were not let go; they expire on their own"

      # made in the evening, it waits for midnight; late, it goes at once
      - name: Wait for midnight
        if: env.RELEASE == 'true'
        run: |
          python - <<'EOF'
          import datetime, os, time
          from zoneinfo import ZoneInfo
          tz = ZoneInfo('America/Denver')
          midnight = datetime.datetime.fromisoformat(os.environ['CHANCE_DAY']).replace(tzinfo=tz)
          wait = (midnight - datetime.datetime.now(tz)).total_seconds()
          print(f"releasing at {midnight:%Y-%m-%d %H:%M %Z}; waiting {max(0, wait) / 60:.0f} minutes")
          if wait > 0:
              time.sleep(wait)
          EOF

      - name: Release it
        if: env.RELEASE == 'true'
        working-directory: exp/chance/engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull -q --rebase
          python publish_album.py --publish-staged "$CHANCE_DAY"

      - name: Commit album.json
        if: env.RELEASE == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add exp/chance/album.json exp/chance/score.json
          git add exp/chance/archive   # what stays: each album's catalogue card and a small copy of its cover
          if [ -f exp/chance/engine/FINISHED ]; then git add exp/chance/engine/FINISHED; fi
          git commit -m "Daily chance album" || echo "No changes to commit"
          git pull --rebase
          git push

      - name: Let go of older albums
        if: env.RELEASE == 'true'
        working-directory: exp/chance/engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_album.py --prune --keep 2

      # each day there is a chance that the album is the last: 1 in 365 for 001, one fewer each day after
      # (002: 1 in 364 ... 365: 1 in 1), so it ends within a year. if it was the last, the series is over:
      # the last album's release stays for good, and this workflow switches itself off.
      - name: If chance ended the series, stop
        if: env.RELEASE == 'true' && hashFiles('exp/chance/engine/FINISHED') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "chance ended the series with this album; switching the daily workflow off"
          gh workflow disable daily_chance.yml --repo "$GITHUB_REPOSITORY"
