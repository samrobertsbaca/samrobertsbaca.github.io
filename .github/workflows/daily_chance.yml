name: Daily Chance Album
# once a day: gather the world's radio fresh at a moment chosen by chance, make an album by chance (numbered
# 0000, 0001 ...; any day may be the last), leave it waiting as a hidden draft release, and at midnight
# mountain time release it and point scorsby.us/exp/chance/ at it.
#
# the timing comes from a small Cloudflare worker (chance-trigger/), which keeps time to the minute: at the
# day's chance hour it asks for the album to be made (mode: make), at midnight for it to be released (mode:
# release). GitHub's own schedule, below, is the backup: from 9 pm it makes sure tomorrow's album exists and
# releases it at midnight itself, and any time of day it releases or makes an album that's late.
concurrency:
  group: daily-chance        # one run at a time; a run waiting its turn finds the work done, and stops
  cancel-in-progress: false
permissions:
  contents: write
  actions: write   # so that, when chance ends the series, the workflow can switch itself off
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'make (a draft, for release at midnight), release (the waiting draft), or both'
        type: choice
        options: [both, make, release]
        default: both
      day:
        description: "the album's day, YYYY-MM-DD in mountain time (blank: the next midnight's)"
        required: false
        default: ''
  schedule:
    # the backup: in the evening (UTC times: 9-10:30 pm mountain daylight time, 8-9:30 pm standard), more than
    # once, as GitHub drops scheduled runs when it's busy; and every hour, to catch up if everything was lost
    - cron: '5 3 * * *'
    - cron: '35 3 * * *'
    - cron: '5 4 * * *'
    - cron: '35 4 * * *'
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/daily_chance.yml'] # and once whenever this file changes

jobs:
  # what's to be done, for which day? nothing, if it's done already.
  decide:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.d.outputs.action }}
      day: ${{ steps.d.outputs.day }}
      pure: ${{ steps.d.outputs.pure }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: What's to be done?
        id: d
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode }}
          DAY: ${{ github.event.inputs.day }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --depth 1 origin main
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime, json, os, secrets, subprocess, sys
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo('America/Denver'))     # mountain time, daylight or standard
          today = now.date().isoformat()
          tomorrow = (now.date() + datetime.timedelta(days=1)).isoformat()
          shown = subprocess.run(['git', 'show', 'origin/main:exp/chance/album.json'], capture_output=True, text=True).stdout
          try:
              released = json.loads(shown or '{}').get('day')          # the day of the album now on the page
          except ValueError:
              released = None
          finished = subprocess.run(['git', 'cat-file', '-e', 'origin/main:exp/chance/engine/FINISHED'],
                                    capture_output=True).returncode == 0
          rels = subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=30"],
                                capture_output=True, text=True).stdout
          drafts = [r['tag_name'] for r in json.loads(rels or '[]') if r.get('draft')]
          waiting = lambda d: any(t.startswith(f'chance-{d}') for t in drafts)   # made, not yet released
          event, mode, day = os.environ['EVENT'], os.environ.get('MODE') or 'both', os.environ.get('DAY') or ''
          action = 'none'
          # whatever asks, the day must be a real date and the mode one of the three: nothing else gets through
          try:
              day = datetime.date.fromisoformat(day).isoformat() if day else ''
          except ValueError:
              print(f"not a day: {day!r}", file=sys.stderr)
              finished, day = True, ''
          if mode not in ('make', 'release', 'both'):
              print(f"not a mode: {mode!r}", file=sys.stderr)
              finished = True
          if finished:
              print("chance has ended the series: no more albums will be made", file=sys.stderr)
          elif event == 'workflow_dispatch':                   # the cloudflare worker, or a run by hand
              if mode == 'make':
                  day = day or tomorrow
                  action = 'none' if released == day or waiting(day) else 'make'
              elif mode == 'release':
                  day = day or today
                  action = 'none' if released == day else ('release' if waiting(day) else 'both')
              else:
                  day = day or (tomorrow if now.hour >= 20 else today)
                  action = 'none' if released == day else ('release' if waiting(day) else 'both')
          else:                                                # GitHub's schedule: the backup
              if released != today:                            # today's album is late: release or make it now
                  day, action = today, ('release' if waiting(today) else 'both')
              elif now.hour >= 21:                             # see tomorrow's album out at midnight, made or not
                  day, action = tomorrow, ('release' if waiting(tomorrow) else 'both')
          print(f"it is {now:%Y-%m-%d %H:%M} mountain time ({event}, {mode}); the album on the page is for {released}; "
                f"waiting as drafts: {drafts or 'none'} -> {action} {day}", file=sys.stderr)
          # about one day in seven is a pure day: no taste anywhere, just the dice
          pure = action in ('make', 'both') and secrets.randbelow(7) == 0
          if pure:
              print("it is a pure day", file=sys.stderr)
          print(f"action={action}")
          print(f"day={day}")
          print(f"pure={'1' if pure else '0'}")
          EOF

  album:
    needs: decide
    if: needs.decide.outputs.action != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MAKE: ${{ needs.decide.outputs.action == 'make' || needs.decide.outputs.action == 'both' }}
      RELEASE: ${{ needs.decide.outputs.action == 'release' || needs.decide.outputs.action == 'both' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg and libraries
        if: env.MAKE == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -q numpy pillow websocket-client

      # 365 samples from all four sources (they are thrown away when the job ends): one for each
      # day of the year, as each day has a 1 in 365 chance of being the last.
      # each shortwave receiver and each open microphone is visited at most once a day; the
      # station streams make up whatever the others can't give. usually under an hour.
      # on a pure day the dial is turned anywhere, with no listening first, and everything is kept
      - name: Gather the radio
        if: env.MAKE == 'true'
        working-directory: exp/chance/engine
        timeout-minutes: 250
        env:
          CHANCE_PURE: ${{ needs.decide.outputs.pure }}
        run: |
          if [ "$CHANCE_PURE" = "1" ]; then DIAL=wild; else DIAL=stations; fi
          python chance_fontana.py --gather 365 --gather-only --workers 8 --dial "$DIAL" || echo "gathering fell short; making do"

      - name: Make the album
        if: env.MAKE == 'true'
        working-directory: exp/chance/engine
        env:
          CHANCE_PURE: ${{ needs.decide.outputs.pure }}
        # mostly 5-7 songs; now and then more, up to 12 (about once a month). a pure day keeps the
        # static, uses no palette, and follows only the Fontana-style score of curves and points.
        run: |
          N=$(python -c "import random; print(random.choices(range(5, 13), weights=[26, 28, 24, 9, 5, 3, 2, 3])[0])")
          echo "$N songs"
          if [ "$CHANCE_PURE" = "1" ]; then EXTRA="--form fontana --keep-static"; else EXTRA=""; fi
          python chance_fontana.py -n "$N" $EXTRA -o "$RUNNER_TEMP/albums"

      # it waits, unheard, as a draft release until midnight
      - name: Leave it waiting as a draft
        if: env.MAKE == 'true'
        working-directory: exp/chance/engine
        env:
          GH_TOKEN: ${{ github.token }}
          CHANCE_DAY: ${{ needs.decide.outputs.day }}
          CHANCE_PURE: ${{ needs.decide.outputs.pure }}
        run: python publish_album.py --albums "$RUNNER_TEMP/albums" --stage

      - name: Commit the album number
        if: env.MAKE == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add exp/chance/engine/titles.txt exp/chance/engine/album_number.txt
          git commit -m "Daily chance album made (waiting for midnight)" || echo "No changes to commit"
          git pull --rebase
          git push

      # made in the evening (by the backup), it waits for midnight; late, it goes at once
      - name: Wait for midnight
        if: env.RELEASE == 'true'
        env:
          CHANCE_DAY: ${{ needs.decide.outputs.day }}
        run: |
          python - <<'EOF'
          import datetime, os, time
          from zoneinfo import ZoneInfo
          tz = ZoneInfo('America/Denver')
          midnight = datetime.datetime.fromisoformat(os.environ['CHANCE_DAY']).replace(tzinfo=tz)
          wait = (midnight - datetime.datetime.now(tz)).total_seconds()
          print(f"releasing at {midnight:%Y-%m-%d %H:%M %Z}; waiting {max(0, wait) / 60:.0f} minutes")
          if wait > 0:
              time.sleep(wait)
          EOF

      - name: Release it
        if: env.RELEASE == 'true'
        working-directory: exp/chance/engine
        env:
          GH_TOKEN: ${{ github.token }}
          CHANCE_DAY: ${{ needs.decide.outputs.day }}
        run: |
          git pull -q --rebase
          python publish_album.py --publish-staged "$CHANCE_DAY"

      - name: Commit album.json
        if: env.RELEASE == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add exp/chance/album.json exp/chance/score.json
          git add exp/chance/archive   # what stays: each album's catalogue card and a small copy of its cover
          if [ -f exp/chance/engine/FINISHED ]; then git add exp/chance/engine/FINISHED; fi
          git commit -m "Daily chance album" || echo "No changes to commit"
          git pull --rebase
          git push

      - name: Let go of older albums
        if: env.RELEASE == 'true'
        working-directory: exp/chance/engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_album.py --prune --keep 2

      # each day there is a 1 in 365 chance that the album is the last. if it was, the series is over:
      # the last album's release stays for good, and this workflow switches itself off.
      - name: If chance ended the series, stop
        if: env.RELEASE == 'true' && hashFiles('exp/chance/engine/FINISHED') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "chance ended the series with this album; switching the daily workflow off"
          gh workflow disable daily_chance.yml --repo "$GITHUB_REPOSITORY"
