name: Daily Chance Album
# once a day, at an hour chosen by chance: gather the world's radio fresh, make an album by chance
# (numbered 0000, 0001 ...), put its audio and cover on a GitHub release, and point
# scorsby.us/exp/chance/ at it.
permissions:
  contents: write
  actions: write   # so that, when chance ends the series, the workflow can switch itself off
on:
  schedule:
    # every hour (at :17, away from the top-of-the-hour rush); only the day's chance hour makes an album
    - cron: '17 * * * *'
  workflow_dispatch: # run it by hand from the Actions tab (counts as the day's album)
  push:
    branches: [main]
    paths: ['.github/workflows/daily_chance.yml'] # and once whenever this file changes

jobs:
  # is this the hour? each UTC day draws its own hour, 00-23, from the date itself; the album is
  # made the first time the clock reaches that hour, unless today's album already exists.
  decide:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
      day: ${{ steps.d.outputs.day }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Is it today's chance hour?
        id: d
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git fetch -q --depth 1 origin main
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime, hashlib, json, os, subprocess, sys
          now = datetime.datetime.now(datetime.timezone.utc)
          day = now.date().isoformat()
          hour = int(hashlib.sha256(f"scorsbt4 {day}".encode()).hexdigest(), 16) % 24
          shown = subprocess.run(['git', 'show', 'origin/main:exp/chance/album.json'],
                                 capture_output=True, text=True).stdout
          try:
              made = json.loads(shown or '{}').get('day')
          except ValueError:
              made = None
          finished = subprocess.run(['git', 'cat-file', '-e', 'origin/main:exp/chance/engine/FINISHED'],
                                    capture_output=True).returncode == 0
          go = not finished and (os.environ['EVENT'] != 'schedule' or (now.hour >= hour and made != day))
          if finished:
              print("chance has ended the series: no more albums will be made", file=sys.stderr)
          print(f"today ({day}) the chance hour is {hour:02d}:00 UTC; it is {now:%H:%M}; "
                f"today's album {'exists' if made == day else 'is not made yet'} -> {'go' if go else 'wait'}",
                file=sys.stderr)
          print(f"go={'true' if go else 'false'}")
          print(f"day={day}")
          EOF

  album:
    needs: decide
    if: needs.decide.outputs.go == 'true'
    # one album at a time; the hourly checks above never wait in this queue
    concurrency:
      group: daily-chance
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg and libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -q numpy pillow websocket-client

      # 365 samples from all four sources (they are thrown away when the job ends): one for each
      # day of the year, as each day has a 1 in 365 chance of being the last.
      # each shortwave receiver and each open microphone is visited at most once a day; the
      # station streams make up whatever the others can't give. usually under an hour.
      - name: Gather today's radio
        working-directory: exp/chance/engine
        timeout-minutes: 250
        run: python chance_fontana.py --gather 365 --gather-only --workers 8 || echo "gathering fell short; making do"

      - name: Make the album
        working-directory: exp/chance/engine
        # mostly 5-7 songs; now and then more, up to 12 (about once a month)
        run: |
          N=$(python -c "import random; print(random.choices(range(5, 13), weights=[26, 28, 24, 9, 5, 3, 2, 3])[0])")
          echo "today: $N songs"
          python chance_fontana.py -n "$N" -o "$RUNNER_TEMP/albums"

      - name: Publish it to a release
        working-directory: exp/chance/engine
        env:
          GH_TOKEN: ${{ github.token }}
          CHANCE_DAY: ${{ needs.decide.outputs.day }}
        run: python publish_album.py --albums "$RUNNER_TEMP/albums" --release

      - name: Commit album.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add exp/chance/album.json exp/chance/engine/titles.txt exp/chance/engine/album_number.txt
          if [ -f exp/chance/engine/FINISHED ]; then git add exp/chance/engine/FINISHED; fi
          git commit -m "Daily chance album" || echo "No changes to commit"
          git pull --rebase
          git push

      - name: Let go of older albums
        working-directory: exp/chance/engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_album.py --prune --keep 2

      # each day there is a 1 in 365 chance that today's album is the last. if it was, the series
      # is over: the last album's release stays for good, and this workflow switches itself off.
      - name: If chance ended the series, stop
        if: hashFiles('exp/chance/engine/FINISHED') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "chance ended the series with this album; switching the daily workflow off"
          gh workflow disable daily_chance.yml --repo "$GITHUB_REPOSITORY"
