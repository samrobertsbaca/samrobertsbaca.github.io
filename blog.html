  <!-- Hamburger JS -->
<script>
  function toggleMenu() {
    const nav = document.getElementById('nav-links');
    nav.classList.toggle('show');
  }

  document.getElementById('improbability-drive').addEventListener('click', function(e) {
    e.preventDefault();

    // Get the container
    const blogIndex = document.getElementById('blog-index');

    // Find all links that live inside the blog-index div
    const links = blogIndex.querySelectorAll('a');

    if (links.length > 0) {
        // Select a random link from the list
        const randomLink = links[Math.floor(Math.random() * links.length)];

        // Navigate to that URL
        window.location.href = randomLink.href;
    }
  });

</script>
