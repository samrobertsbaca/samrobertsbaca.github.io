<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i am the lighthouse</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>
<body>

<script>
// --- VERTEX SHADER ---
const vertShader = `
attribute vec3 aPosition;
attribute vec2 aTexCoord;
varying vec2 vTexCoord;
void main() {
    vTexCoord = aTexCoord;
    vec4 positionVec4 = vec4(aPosition, 1.0);
    positionVec4.xy = positionVec4.xy * 2.0 - 1.0;
    gl_Position = positionVec4;
}
`;

// --- FRAGMENT SHADER ---
const fragShader = `
#ifdef GL_ES
precision highp float;
#endif

uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_transition; // NEW: Controls the whiteout

varying vec2 vTexCoord;

float hash(vec2 p) { return fract(1e4 * sin(17.0 * p.x + p.y * 0.1) * (0.1 + abs(sin(p.y * 13.0 + p.x)))); }

float noise(vec2 x) {
    vec2 i = floor(x);
    vec2 f = fract(x);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    vec2 shift = vec2(100.0);
    mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
    for (int i = 0; i < 5; ++i) {
        v += a * noise(p);
        p = rot * p * 2.0 + shift;
        a *= 0.5;
    }
    return v;
}

void main() {
    vec2 st = gl_FragCoord.xy / u_resolution.xy;
    st = st * 2.0 - 1.0;
    st.x *= u_resolution.x / u_resolution.y;

    vec2 mouse = u_mouse / u_resolution.xy;
    mouse = mouse * 2.0 - 1.0;
    mouse.x *= u_resolution.x / u_resolution.y;

    float distToCenter = length(st);
    float distToMouse = length(st - mouse);

    vec2 warp = st + fbm(st * 3.0 + u_time * 0.2);

    // As the transition happens, we calm the noise so the light expands smoothly
    float n = fbm(warp * 2.0 - u_time * 0.4) * (1.0 - u_transition);

    float breath = (sin(u_time * 1.5) * 0.5 + 0.5) * 0.2 + 0.8;

    // NEW: The Light Expansion Logic
    // We use an exponential curve (pow) so it starts slow and flashes rapidly at the end
    float expansion = pow(u_transition, 4.0) * 20.0;

    // The core grows based on the expansion variable
    float core = (0.05 + expansion) / (length(st + n * 0.1 * breath) + 0.01);
    core = pow(core, 1.5);

    vec3 colorA = vec3(0.0, 0.705, 1.0);
    vec3 colorB = vec3(0.1, 0.0, 0.3);
    vec3 colorC = vec3(1.0, 1.0, 1.0);

    vec3 bg = mix(colorB, colorA, n * exp(-distToCenter * 1.5));
    vec3 finalColor = bg + (colorC * core);

    float glitchTrigger = smoothstep(0.5, 0.0, distToMouse) * 0.05 * (1.0 - u_transition);
    finalColor.r += fbm(st + u_time + glitchTrigger) * 0.1 * glitchTrigger;
    finalColor.b += fbm(st - u_time - glitchTrigger) * 0.1 * glitchTrigger;

    // Force the final color to pure white at the very end of the transition
    finalColor = mix(finalColor, vec3(1.0), smoothstep(0.8, 1.0, u_transition));

    gl_FragColor = vec4(finalColor, 1.0);
}
`;

// --- p5.js SKETCH ---
let lighthouseShader;
let isTransitioning = false;
let transitionProgress = 0.0;
let clickRadius;

function setup() {
    createCanvas(windowWidth, windowHeight, WEBGL);
    pixelDensity(1);
    noStroke();
    lighthouseShader = createShader(vertShader, fragShader);

    // Define the clickable area based on screen size
    clickRadius = min(width, height) * 0.15;
}

function draw() {
    shader(lighthouseShader);

    lighthouseShader.setUniform('u_resolution', [width, height]);
    lighthouseShader.setUniform('u_time', millis() / 1000.0);

    let mx = lerp(mouseX, width/2, 0.05);
    let my = lerp(mouseY, height/2, 0.05);
    lighthouseShader.setUniform('u_mouse', [mouseX, (height - mouseY)]);

    // --- NEW: Handle the Transition State ---
    if (isTransitioning) {
        transitionProgress += 0.015; // Adjust this number to change the speed of the whiteout

        // Once the screen is pure white, redirect
        if (transitionProgress >= 1.2) {
            window.location.href = '/home.html';
        }
    } else {
        // Change cursor to a pointer when hovering over the light core
        let d = dist(mouseX, mouseY, width/2, height/2);
        if (d < clickRadius) {
            cursor(HAND);
        } else {
            cursor(ARROW);
        }
    }

    // Pass the transition state to the shader
    lighthouseShader.setUniform('u_transition', transitionProgress);

    rectMode(CENTER);
    rect(0, 0, width, height);
}

// --- NEW: Click Event ---
function mousePressed() {
    if (isTransitioning) return; // Ignore clicks if already transitioning

    let d = dist(mouseX, mouseY, width/2, height/2);
    if (d < clickRadius) {
        isTransitioning = true;
        cursor(ARROW); // Reset cursor during the flash
    }
}

function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
    clickRadius = min(width, height) * 0.15; // Update clickable area on resize
}
</script>
</body>
</html>
