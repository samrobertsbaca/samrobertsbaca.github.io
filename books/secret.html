<!DOCTYPE html>
<html lang="en">
<head>
  <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-F0TBFJSGJ9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F0TBFJSGJ9');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/favicon.webp" rel="icon" type="image/x-icon"/>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0947;
      overflow: hidden;
    }

    #rotator {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100dvw;   /* Changed from vw to dvw */
      height: 100dvh;  /* Changed from vh to dvh */
      transform: translate(-50%, -50%);
      transform-origin: center center;
      transition: transform 0s ease;
    }

    /* Force rotation for mobile portrait */
    .force-landscape #rotator {
      transform: translate(-50%, -50%) rotate(90deg);
      width: 100dvh;   /* Changed from vh to dvh */
      height: 100dvw;  /* Changed from vw to dvw */
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* --- FADE IN SYSTEM CONFIGURATION --- */
    #content-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 30px;
      width: 92%;
      max-width: 1050px;
      z-index: 10;
      box-sizing: border-box;

      /* Start completely transparent */
      opacity: 0;
      /* Smooth cubic transition matching the win-out pacing */
      transition: opacity 1.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Triggers via JavaScript when the page environment mounts */
    #content-container.fade-in-active {
      opacity: 1;
    }

    .image-pane {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #smile {
      max-width: 45vmin;
      max-height: 65vmin;
      object-fit: contain;
      pointer-events: none;
    }

    .player-pane {
      flex: 1.2;
      width: 100%;
      min-width: 300px;
      /* Shifts the player slightly leftward toward the image */
      margin-left: -20px;
    }

    /* Layout override for mobile/small viewports */
    /* Layout override for mobile/small viewports */
    @media (max-width: 768px) {
      #content-container {
        flex-direction: row; /* Keep them side-by-side */
        gap: 15px;
        width: 96%; /* Slightly wider to maximize available space */
      }
      .image-pane {
        flex: 0.8; /* Make the image container slightly tighter */
      }
      .player-pane {
        flex: 1.2;
        margin-left: 0;
        min-width: 0; /* Prevents flex items from overflowing their container */
      }
      #smile {
        max-width: 100%; /* Let it scale fluidly with the pane */
        max-height: 90vmin;
      }
    }
  </style>
</head>

<body>
  <div id="rotator">
    <canvas id="canvas"></canvas>

    <!-- Unified Container for Left Image & Right Player Layout -->
    <div id="content-container">
      <div class="image-pane">
        <img id="smile" src="/media/bluerose/smile.png" alt="smile">
      </div>

      <div class="player-pane">
        <!-- The Audio Player Element Target -->
        <div data-audio-player
             data-src="/media/bluerose/STAR.mp3"
             data-title="STAR"
             data-artist="scorsby"
             data-theme="#212ee0"
             data-art="/media/bluerose/star_cover.png">
        </div>
      </div>
    </div>
  </div>

  <!-- Audio Player Engine Initialization -->
  <script src="/js/audio_player.js"></script>

  <script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const particles = [];
  let logicalWidth = window.innerWidth;
  let logicalHeight = window.innerHeight;

  function drawSparkStar(x, y, size, alpha) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = '#9adaff';
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#4bb6fb';
    ctx.beginPath();
    ctx.moveTo(x, y - size * 2.5);
    ctx.quadraticCurveTo(x, y, x + size * 2.5, y);
    ctx.quadraticCurveTo(x, y, x, y + size * 2.5);
    ctx.quadraticCurveTo(x, y, x - size * 2.5, y);
    ctx.quadraticCurveTo(x, y, x, y - size * 2.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  class Particle {
  constructor(isInitial = false) {
    this.reset();

    // Stagger the first wave of particles so they don't die all at once
    if (isInitial) {
      this.alpha = Math.random(); // Starts them at random points in their life cycle

      // Fast-forward their positions so they don't all start clustered in the center
      const lifetimeProgress = (1 - this.alpha) / this.decay;
      this.x += this.vx * lifetimeProgress;
      this.y += this.vy * lifetimeProgress;
    }
  }

  reset() {
    this.x = logicalWidth / 2;
    this.y = logicalHeight / 2;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1;
    this.decay = Math.random() * 0.001 + 0.005;
    this.size = Math.random() * 1.5 + 0.8;
    this.shimmerOffset = Math.random() * 100;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
    this.shimmerOffset += 0.15;
    if (this.alpha <= 0) this.reset(); // Normal resets always start back at alpha = 1
  }

  draw() {
    const shimmer = (Math.sin(this.shimmerOffset) * 0.4) + 0.6;
    drawSparkStar(this.x, this.y, this.size, this.alpha * shimmer);
  }
}

  function handleResize() {
    const isLandscape = document.body.classList.contains('force-landscape');
    logicalWidth = isLandscape ? window.innerHeight : window.innerWidth;
    logicalHeight = isLandscape ? window.innerWidth : window.innerHeight;

    canvas.width = logicalWidth;
    canvas.height = logicalHeight;
  }

  function applyOrientation() {
    const isPort = window.matchMedia('(orientation: portrait) and (max-width: 820px)').matches;
    document.body.classList.toggle('force-landscape', isPort);
    handleResize();
  }

  // Change this line in your script:
  for (let i = 0; i < 200; i++) particles.push(new Particle(true));

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', applyOrientation);
  window.addEventListener('orientationchange', () => setTimeout(applyOrientation, 200));

  applyOrientation();
  animate();

  // --- TRIGGER THE FADE-IN ONCE RENDERING STARTS ---
  window.addEventListener('DOMContentLoaded', () => {
    // RequestAnimationFrame ensures layout engines have completed the initial paint
    requestAnimationFrame(() => {
      document.getElementById('content-container').classList.add('fade-in-active');
    });
  });
  </script>
</body>
</html>
