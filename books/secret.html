<!DOCTYPE html>
<html lang="en">
<head>
  <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-F0TBFJSGJ9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F0TBFJSGJ9');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/favicon.webp" rel="icon" type="image/x-icon"/>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0947;
      overflow: hidden;
    }

    #rotator {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      transition: transform 0.3s ease;
    }

    /* Force rotation for mobile portrait */
    .force-landscape #rotator {
      transform: translate(-50%, -50%) rotate(90deg);
      width: 100vh;
      height: 100vw;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Side-by-Side Content Layout */
    #content-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 30px;
      width: 92%;
      max-width: 1050px;
      z-index: 10;
      box-sizing: border-box;
    }

    .image-pane {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #smile {
      max-width: 45vmin;
      max-height: 65vmin;
      object-fit: contain;
      pointer-events: none;
    }

    .player-pane {
      flex: 1.2;
      width: 100%;
      min-width: 300px;
      /* Shifts the player slightly leftward toward the image */
      margin-left: -20px;
    }

    /* Layout override for mobile/small viewports */
    @media (max-width: 768px) {
      #content-container {
        flex-direction: column;
        gap: 15px;
      }
      .player-pane {
        margin-left: 0; /* Reset side shift on stacked layout */
        min-width: 100%;
      }
      #smile {
        max-width: 70vmin;
        max-height: 50vmin; /* Max out real estate safely */
      }
    }
  </style>
</head>

<body>
  <div id="rotator">
    <canvas id="canvas"></canvas>

    <!-- Unified Container for Left Image & Right Player Layout -->
    <div id="content-container">
      <div class="image-pane">
        <img id="smile" src="/media/bluerose/smile.png" alt="smile">
      </div>

      <div class="player-pane">
        <!-- The Audio Player Element Target -->
        <div data-audio-player
             data-src="/media/bluerose/STAR.mp3"
             data-title="STAR"
             data-artist="scorsby"
             data-theme="#00b4ff"
             data-art="/media/bluerose/star_cover.png"
             data-lyrics="<p>driving on the milky way<br>it’s a lonesome quiet view<br>i pass black holes every day<br>got no signal coming through</p><p>then i see you<br>shimmering in the distance<br>just to feel you,<br>i’d cross every solar system</p><p>cause baby you're a star<br>lighting up my heart<br>whether near or far<br>light is what you are</p><p>can i always be beside you<br>i never would confine you <br>i love the way you smile<br>your gravity has got me<br>orbiting you, it's true</p><p>cause baby you're a star<br>lighting up my heart<br>whether near or far<br>light is what you are</p><p>baby you're a star<br>lighting up my heart<br>whether near or far<br>light is what you are</p><p>baby you're a ... star<br>lighting up my ... heart<br>... star<br>... heart</p>">
        </div>
      </div>
    </div>
  </div>

  <!-- Audio Player Engine Initialization -->
  <script src="/js/audio_player.js"></script>

  <script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const particles = [];
  let logicalWidth = window.innerWidth;
  let logicalHeight = window.innerHeight;

  function drawSparkStar(x, y, size, alpha) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = '#9adaff';
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#4bb6fb';
    ctx.beginPath();
    ctx.moveTo(x, y - size * 2.5);
    ctx.quadraticCurveTo(x, y, x + size * 2.5, y);
    ctx.quadraticCurveTo(x, y, x, y + size * 2.5);
    ctx.quadraticCurveTo(x, y, x - size * 2.5, y);
    ctx.quadraticCurveTo(x, y, x, y - size * 2.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  class Particle {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = logicalWidth / 2;
      this.y = logicalHeight / 2;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.alpha = 1;
      this.decay = Math.random() * 0.01 + 0.005;
      this.size = Math.random() * 1.5 + 0.8;
      this.shimmerOffset = Math.random() * 100;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.alpha -= this.decay;
      this.shimmerOffset += 0.15;
      if (this.alpha <= 0) this.reset();
    }
    draw() {
      const shimmer = (Math.sin(this.shimmerOffset) * 0.4) + 0.6;
      drawSparkStar(this.x, this.y, this.size, this.alpha * shimmer);
    }
  }

  function handleResize() {
    const isLandscape = document.body.classList.contains('force-landscape');
    logicalWidth = isLandscape ? window.innerHeight : window.innerWidth;
    logicalHeight = isLandscape ? window.innerWidth : window.innerHeight;

    canvas.width = logicalWidth;
    canvas.height = logicalHeight;
  }

  function applyOrientation() {
    const isPort = window.matchMedia('(orientation: portrait) and (max-width: 820px)').matches;
    document.body.classList.toggle('force-landscape', isPort);
    handleResize();
  }

  for (let i = 0; i < 60; i++) particles.push(new Particle());

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', applyOrientation);
  window.addEventListener('orientationchange', () => setTimeout(applyOrientation, 200));

  applyOrientation();
  animate();
  </script>
</body>
</html>
