<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the book of blue roses</title>
<style>
  :root {
    --bg-color: #0b0947; /* Starts at the first hex value */
  }

  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background: var(--bg-color);
    transition: background-color 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }

  #stage-outer{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage-inner{
    position:relative; display:flex; align-items:center; justify-content:center;
    width:100vw; height:100vh; transition:transform 0.25s ease;
  }
  body.force-landscape #stage-inner{ width:100vh; height:100vw; transform:rotate(90deg); }

  #book{
    position:relative;
    width: min(94vw, calc(88vh * (3265 / 2676)));
    height: min(88vh, calc(94vw * (2676 / 3265)));
    aspect-ratio: 3265 / 2676;
    perspective:2400px;
    box-shadow:0 24px 60px rgba(0,0,0,0.55);
    border-radius:4px;
    background: var(--bg-color);
    transition: background-color 0.5s cubic-bezier(0.25, 1, 0.5, 1);
  }

  body.force-landscape #book {
    width: min(100vh, calc(100vw * (3265 / 2676)));
    height: min(100vw, calc(100vh * (3265 / 2676)));
  }

  .leaf{
    position:absolute; top:0; bottom:0; width:50%;
    overflow:hidden; background: var(--bg-color);
    transition: background-color 0.5s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .leaf.left{ left:0; border-radius:4px 0 0 4px; }
  .leaf.right{ right:0; border-radius:0 4px 4px 0; }

  .leaf-bg{
    position:absolute; top:0; height:100%; width:200%;
    background-size: 100% 100%; background-repeat:no-repeat;
    will-change: background-image;
  }
  .leaf.left .leaf-bg{ left:0; background-position:left center; }
  .leaf.right .leaf-bg{ left:-100%; background-position:right center; }

  #flap{
    position:absolute; top:0; width:50%; height:100%;
    transform-style:preserve-3d;
    pointer-events:none;
    z-index:10;
    display:none;
    will-change: transform;
  }
  #flap.active{ display:block; }
  #flap.anchor-right{ right:0; transform-origin:left center; }
  #flap.anchor-left{ left:0; transform-origin:right center; }

  #flap .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility: hidden;
    overflow:hidden;
    background: var(--bg-color);
    transition: background-color 0.5s cubic-bezier(0.25, 1, 0.5, 1);
  }
  #flap .face-bg{
    position:absolute; top:0; height:100%; width:200%;
    background-size: 100% 100%; background-repeat:no-repeat;
  }

  #flap.anchor-right .face.front .face-bg{ left:-100%; background-position:right center; }
  #flap.anchor-left .face.front .face-bg{ left:0; background-position:left center; }

  #flap.anchor-right .face.back .face-bg{ left:0; background-position:left center; }
  #flap.anchor-left .face.back .face-bg{ left:-100%; background-position:right center; }
  #flap .face.back{ transform:rotateY(180deg); }

  #flap.smooth-finish{ transition:transform 0.44s cubic-bezier(0.23, 1, 0.32, 1); }
  #flap.turbo-finish{ transition:transform 0.14s ease-out; }

  .corner-curl{
    position:absolute; bottom:0; width:38px; height:38px;
    z-index:21; pointer-events:none;
    transition:transform 0.25s ease, opacity 0.25s ease;
    opacity:0.2;
  }
  .corner-curl.right{
    right:0; border-radius:0 0 4px 0;
    background:linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.08) 65%, transparent 66%);
    clip-path:polygon(100% 100%, 0 100%, 100% 0);
  }
  .corner-curl.left{
    left:0; border-radius:0 0 0 4px;
    background:linear-gradient(225deg, transparent 50%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.08) 65%, transparent 66%);
    clip-path:polygon(0 100%, 100% 100%, 0 0);
  }

  #top-utilities {
    position: fixed; top: 24px; right: 24px;
    display: flex; gap: 12px; z-index: 100;
  }

  .btn{
    border:none; background:rgba(255,255,255,0.08); color:#eee;
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  .btn:hover{ background:rgba(255,255,255,0.14); }
  .btn:active{ background:rgba(255,255,255,0.22); }

  .edge-nav {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 48px; height: 64px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    color: rgba(255, 255, 255, 0.35);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 90;
    transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .edge-nav:hover {
    background: rgba(255, 255, 255, 0.09);
    color: rgba(255, 255, 255, 0.8);
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .edge-nav:active {
    background: rgba(255, 255, 255, 0.16);
    transform: translateY(-50%) scale(0.95);
  }
  .edge-nav.left-edge { left: 16px; }
  .edge-nav.right-edge { right: 16px; }

  /* Upscaling fast-forward & rewind visual footprint naturally */
  .edge-nav svg {
    width: 26px;
    height: 26px;
  }

  body.force-landscape #top-utilities {
    top: auto; bottom: 16px; right: 16px;
    flex-direction: column; gap: 10px;
  }
  body.force-landscape .btn { transform: rotate(90deg); }

  body.force-landscape .edge-nav {
    top: auto; left: 50%; transform: translateX(-50%);
    width: 64px; height: 48px;
  }
  body.force-landscape .edge-nav.left-edge { bottom: 16px; left: calc(50% - 70px); transform: translateX(-50%) rotate(90deg); }
  body.force-landscape .edge-nav.right-edge { bottom: 16px; left: calc(50% + 70px); right: auto; transform: translateX(-50%) rotate(90deg); }

  @media (max-width: 820px) {
    .btn { width: 38px; height: 38px; }
    .btn svg { width: 16px; height: 16px; }
    .edge-nav { width: 36px; height: 50px; }
    .edge-nav svg { width: 20px; height: 20px; }
    .edge-nav.left-edge { left: 8px; }
    .edge-nav.right-edge { right: 8px; }
  }

  /* Shared text styling for link and counter to match cleanly over the background colors */
  #counter, .side-nav-left {
    position: absolute; bottom: -28px;
    color: rgba(255, 255, 255, 0.45); font-size: 12px;
    letter-spacing: 0.05em; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  #counter {
    right: 0; text-align: right; pointer-events: none;
  }

  .side-nav-left {
    left: 0; text-align: left; z-index: 30;
  }

  .page-nav-link {
    color: inherit;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .page-nav-link:hover {
    color: rgba(255, 255, 255, 0.85);
  }

  @media (max-width: 820px) {
    /* Break out of absolute positioning scope to target screen edges directly */
    #counter {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 30;
    }
    .side-nav-left {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 30;
    }
  }
</style>
</head>
<body>

<div id="top-utilities">
  <button class="btn" id="btn-load" aria-label="load files" title="Load Folder Files">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </svg>
  </button>
  <button class="btn" id="btn-fullscreen" aria-label="toggle fullscreen" title="Toggle Fullscreen">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
  </button>
  <input type="file" id="folder-input" multiple accept="image/*" style="display:none">
</div>

<button class="edge-nav left-edge" id="edge-rewind" aria-label="Rewind five spreads" title="Rewind 5 Spreads">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="11 19 4 12 11 5"></polyline>
    <polyline points="19 19 12 12 19 5"></polyline>
  </svg>
</button>

<button class="edge-nav right-edge" id="edge-fforward" aria-label="Fast forward five spreads" title="Fast Forward 5 Spreads">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="13 5 20 12 13 19"></polyline>
    <polyline points="5 5 12 12 5 19"></polyline>
  </svg>
</button>

<div id="stage-outer">
  <div id="stage-inner">
    <div id="book">
      <div class="leaf left" id="leaf-left"><div class="leaf-bg" id="leaf-left-bg"></div></div>
      <div class="leaf right" id="leaf-right"><div class="leaf-bg" id="leaf-right-bg"></div></div>
      <div id="flap">
        <div class="face front"><div class="face-bg" id="flap-front-bg"></div></div>
        <div class="face back"><div class="face-bg" id="flap-back-bg"></div></div>
      </div>
      <div class="corner-curl right"></div>
      <div class="corner-curl left"></div>

      <!-- Left-side project navigation anchor mimicking layout footprint of right counter -->
      <div class="side-nav-left">
        <a href="https://scorsby.us" class="page-nav-link" target="_blank">scorsby.us</a>
      </div>
      <div id="counter">1 / 1</div>
    </div>
  </div>
</div>

<script>
const shuffle = true;
const maxPages = 99;

// Hex configurations for page gradient span
const startHex = "0b0947";
const endHex = "470929";

// Helper to convert hex strings cleanly into rgb numbers
function hexToRgb(hex) {
  const cleanHex = hex.replace('#', '');
  const bigint = parseInt(cleanHex, 16);
  return {
    r: (bigint >> 16) & 255,
    g: (bigint >> 8) & 255,
    b: bigint & 255
  };
}

const startColor = hexToRgb(startHex);
const endColor = hexToRgb(endHex);

function placeholder(label, bg, fg){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="3265" height="2676">
    <rect width="3265" height="2676" fill="${bg}"/>
    <text x="1632" y="1338" font-family="Georgia, serif" font-size="120" fill="${fg}"
      text-anchor="middle" dominant-baseline="middle">${label}</text>
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

const pages = [
  placeholder('the book of blue roses', '#4bb6fb', '#111'),
  placeholder('spread 01', '#c9c4ee', '#26215c'),
  placeholder('spread 02', '#f0997b', '#4a1b0c'),
  placeholder('spread 03', '#97c459', '#173404'),
  placeholder('spread 04', '#ed93b1', '#4b1528'),
  placeholder('the end', '#f4c0d1', '#4b1528'),
];

let idx = 0;
let isAnimating = false;
let finishTimeout = null;
let midTurnTimeout = null;

let isDragging = false;
let startX = 0;
let startY = 0;
let lastX = 0;
let currentDir = 0;
let currentTargetIdx = 0;
let bookWidth = 0;
let dragMode = "single";
let hasTriggeredDragMidColor = false;

let leafLeftBg, leafRightBg, flap, flapFrontBg, flapBackBg, counter, bookEl;

const preloadedImages = {};

// Linear interpolation utility function
function lerp(start, end, amt) {
  return Math.round(start + (end - start) * amt);
}

// Map the background color based purely on progress through the collection range
function updateDynamicBackground(pageIndex) {
  if (pages.length <= 1) {
    document.documentElement.style.setProperty('--bg-color', `rgb(${startColor.r}, ${startColor.g}, ${startColor.b})`);
    return;
  }

  const factor = pageIndex / (pages.length - 1);
  const r = lerp(startColor.r, endColor.r, factor);
  const g = lerp(startColor.g, endColor.g, factor);
  const b = lerp(startColor.b, endColor.b, factor);

  document.documentElement.style.setProperty('--bg-color', `rgb(${r}, ${g}, ${b})`);
}

function preloadAdjacentPages(currentIdx) {
  const targets = [currentIdx - 2, currentIdx - 1, currentIdx + 1, currentIdx + 2];
  targets.forEach(i => {
    if (i >= 0 && i < pages.length && !preloadedImages[pages[i]]) {
      const img = new Image();
      img.src = pages[i];
      preloadedImages[pages[i]] = img;
    }
  });
}

function naturalSort(a, b){
  return a.localeCompare(b, undefined, { numeric:true, sensitivity:'base' });
}

function processImages(items, isFileList = false) {
  const sortedItems = [...items].sort((a, b) => {
    const nameA = isFileList ? a.name : a;
    const nameB = isFileList ? b.name : b;
    return naturalSort(nameA, nameB);
  });

  if (!shuffle) {
    pages.length = 0;
    let addedCount = 0;
    for (let i = 0; i < sortedItems.length; i++) {
      if (maxPages !== null && addedCount >= maxPages) break;
      pages.push(isFileList ? URL.createObjectURL(sortedItems[i]) : `bluerose_images/${sortedItems[i]}`);
      addedCount++;
    }
    preloadAdjacentPages(0);
    return;
  }

  const bundles = [];
  const seqMap = new Map();

  sortedItems.forEach(item => {
    const name = isFileList ? item.name : item;
    const match = name.match(/_seq(\d+)/i);

    if (match) {
      const seqNum = parseInt(match[1], 10);
      if (!seqMap.has(seqNum)) {
        const newSeq = { type: 'sequence', seqNum: seqNum, items: [] };
        seqMap.set(seqNum, newSeq);
        bundles.push(newSeq);
      }
      seqMap.get(seqNum).items.push(item);
    } else {
      bundles.push({ type: 'single', items: [item] });
    }
  });

  let firstSeq = null;
  let lastSeq = null;
  let midSeq = null;
  const seqNumbers = Array.from(seqMap.keys()).sort((a, b) => a - b);

  if (seqNumbers.length > 0) {
    if (seqNumbers.includes(1)) firstSeq = seqMap.get(1);
    if (seqNumbers.includes(8)) midSeq = seqMap.get(8);

    const possibleLast = seqNumbers.filter(n => n !== 1 && n !== 8);
    if (possibleLast.length > 0) {
      lastSeq = seqMap.get(possibleLast[possibleLast.length - 1]);
    } else if (seqNumbers.length > 1 || !seqNumbers.includes(1)) {
      lastSeq = seqMap.get(seqNumbers[seqNumbers.length - 1]);
    }
  }

  const pool = bundles.filter(b => b !== firstSeq && b !== lastSeq && b !== midSeq);

  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  const midfillBundles = [];
  if (firstSeq) midfillBundles.push(firstSeq);
  midfillBundles.push(...pool);

  if (midSeq) {
    let totalPagesSoFar = 0;
    midfillBundles.forEach(b => totalPagesSoFar += b.items.length);

    let totalTargetPages = totalPagesSoFar;
    if (lastSeq && lastSeq !== firstSeq && lastSeq !== midSeq) {
      totalTargetPages += lastSeq.items.length;
    }

    const idealHalfwayPage = Math.floor(totalTargetPages / 2);
    let currentCount = 0;
    let targetBundleIdx = midfillBundles.length;

    for (let i = 0; i < midfillBundles.length; i++) {
      currentCount += midfillBundles[i].items.length;
      if (currentCount >= idealHalfwayPage) {
        targetBundleIdx = i + 1;
        break;
      }
    }
    midfillBundles.splice(targetBundleIdx, 0, midSeq);
  }

  const hasKeepFlag = (bundle) => {
    return bundle.items.some(item => {
      const filename = isFileList ? item.name : item;
      return filename.toLowerCase().includes('keep');
    });
  };

  pages.length = 0;

  let totalAllowedBudget = (maxPages !== null) ? maxPages : Infinity;
  let lastSeqSize = (lastSeq && lastSeq !== firstSeq && lastSeq !== midSeq) ? lastSeq.items.length : 0;

  let middleKeepSize = 0;
  midfillBundles.forEach(b => {
    if (b !== firstSeq && b !== midSeq && hasKeepFlag(b)) {
      middleKeepSize += b.items.length;
    }
  });

  let middleBudgetLimit = totalAllowedBudget - lastSeqSize;
  let accumulatedPages = 0;

  for (let b of midfillBundles) {
    const isKeepBundle = hasKeepFlag(b);

    if (!isKeepBundle && (accumulatedPages + b.items.length > middleBudgetLimit)) {
      continue;
    }
    if (isKeepBundle && (accumulatedPages + b.items.length > totalAllowedBudget - lastSeqSize)) {
      continue;
    }

    b.items.forEach(item => {
      pages.push(isFileList ? URL.createObjectURL(item) : `bluerose_images/${item}`);
    });
    accumulatedPages += b.items.length;
  }

  if (lastSeq && lastSeq !== firstSeq && lastSeq !== midSeq) {
    lastSeq.items.forEach(item => {
      pages.push(isFileList ? URL.createObjectURL(item) : `bluerose_images/${item}`);
    });
  }

  preloadAdjacentPages(0);
}

async function autoLoadAssets(){
  const isOnServer = window.location.protocol.startsWith('http');
  if(!isOnServer) return false;

  try{
    // Fixed endpoint to target bluerose_images directory
    const res = await fetch('./bluerose_images/manifest.json', { cache:'no-store' });
    if(res.ok) {
      const list = await res.json();
      if(Array.isArray(list) && list.length > 0) {
        const filteredList = list.filter(item => !item.includes('/') && !item.includes('\\'));
        if(filteredList.length > 0) {
          processImages(filteredList, false);
          return true;
        }
      }
    }
  }catch(err){}

  try {
    // Fixed scraper path to target bluerose_images directory
    const res = await fetch('./bluerose_images/');
    if(res.ok) {
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const links = Array.from(doc.querySelectorAll('a'));

      const fileNames = links
        .map(link => link.getAttribute('href'))
        .filter(href => href && /\.(png|jpe?g|webp|gif)$/i.test(href))
        .map(href => decodeURIComponent(href).split('/').pop());

      if (fileNames.length > 0) {
        processImages(fileNames, false);
        return true;
      }
    }
  } catch(err){}

  return false;
}

function loadFromFileList(fileList){
  const imgFiles = Array.from(fileList).filter(f => {
    const isImg = /\.(png|jpe?g|webp|gif)$/i.test(f.name);
    const inSubfolder = f.webkitRelativePath && (f.webkitRelativePath.split('/').length > 2);
    return isImg && !inSubfolder;
  });

  if(imgFiles.length === 0) return;

  for (const key in preloadedImages) delete preloadedImages[key];

  processImages(imgFiles, true);
  idx = 0;
  setIdle(0);
  updateCounterDisplay(0);
}

function setBg(el, url){
  if(el) el.style.backgroundImage = `url("${url}")`;
}

function setIdle(i){
  if (pages.length === 0) return;
  setBg(leafLeftBg, pages[i]);
  setBg(leafRightBg, pages[i]);
  updateDynamicBackground(i);
  preloadAdjacentPages(i);
}

function updateCounterDisplay(i) {
  if(counter && pages.length > 0) {
    counter.textContent = `${i + 1} / ${pages.length}`;
  }
}

function forceInstantComplete() {
  if (!isAnimating) return;
  clearTimeout(finishTimeout);
  clearTimeout(midTurnTimeout);
  idx = currentTargetIdx;
  setIdle(idx);
  flap.className = '';
  flap.style.transform = '';
  isAnimating = false;
}

function turn(direction){
  if (isDragging) return;

  if (isAnimating) {
    forceInstantComplete();
  }

  let target = idx + direction;
  target = Math.max(0, Math.min(pages.length - 1, target));
  if (target === idx) return;

  isAnimating = true;
  currentTargetIdx = target;
  updateCounterDisplay(target);

  flap.style.transform = '';

  if(direction > 0){
    flap.className = 'active anchor-right';
    setBg(flapFrontBg, pages[idx]);
    setBg(flapBackBg, pages[target]);
    setBg(leafRightBg, pages[target]);
  } else {
    flap.className = 'active anchor-left';
    setBg(flapFrontBg, pages[idx]);
    setBg(flapBackBg, pages[target]);
    setBg(leafLeftBg, pages[target]);
  }

  flap.getBoundingClientRect();

  if (Math.abs(direction) > 1) {
    flap.classList.add('turbo-finish');
    if (direction > 0) {
      flap.style.transform = 'rotateY(-180deg)';
    } else {
      flap.style.transform = 'rotateY(180deg)';
    }

    midTurnTimeout = setTimeout(() => {
      updateDynamicBackground(target);
    }, 70);

    finishTimeout = setTimeout(() => {
      idx = target;
      setIdle(idx);
      flap.className = '';
      flap.style.transform = '';
      isAnimating = false;
    }, 140);
  } else {
    flap.classList.add('smooth-finish');
    if (direction > 0) {
      flap.style.transform = 'rotateY(-180deg)';
    } else {
      flap.style.transform = 'rotateY(180deg)';
    }

    midTurnTimeout = setTimeout(() => {
      updateDynamicBackground(target);
    }, 220);

    finishTimeout = setTimeout(() => {
      idx = target;
      setIdle(idx);
      flap.className = '';
      flap.style.transform = '';
      isAnimating = false;
    }, 440);
  }
}

// Check small portrait context variables
function isSmallPortrait(){
  return window.matchMedia('(orientation: portrait) and (max-width: 820px)').matches;
}

function toggleManualFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {});
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
}

function applyFallback(){ document.body.classList.toggle('force-landscape', isSmallPortrait()); }

document.addEventListener('DOMContentLoaded', () => {
  leafLeftBg = document.getElementById('leaf-left-bg');
  leafRightBg = document.getElementById('leaf-right-bg');
  flap = document.getElementById('flap');
  flapFrontBg = document.getElementById('flap-front-bg');
  flapBackBg = document.getElementById('flap-back-bg');
  counter = document.getElementById('counter');
  bookEl = document.getElementById('book');

  const btnLoad = document.getElementById('btn-load');
  const isOnServer = window.location.protocol.startsWith('http');

  if (isOnServer && btnLoad) {
    btnLoad.remove();
  } else if(btnLoad) {
    btnLoad.addEventListener('click', () => document.getElementById('folder-input').click());
  }

  document.getElementById('folder-input').addEventListener('change', e => loadFromFileList(e.target.files));
  document.getElementById('btn-fullscreen').addEventListener('click', toggleManualFullscreen);

  document.getElementById('edge-rewind').addEventListener('click', (e) => {
    e.stopPropagation();
    turn(-5);
  });
  document.getElementById('edge-fforward').addEventListener('click', (e) => {
    e.stopPropagation();
    turn(5);
  });

  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest('#top-utilities') || e.target.closest('.btn') || e.target.closest('.edge-nav')) return;

    if (isAnimating) {
      forceInstantComplete();
    }

    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    lastX = e.clientX;
    currentDir = 0;
    bookWidth = bookEl.clientWidth || window.innerWidth;
    hasTriggeredDragMidColor = false;

    if (e.target.closest('#book')) {
      dragMode = "single";
    } else {
      dragMode = "fast";
    }
  });

  document.addEventListener('pointermove', (e) => {
    if (!isDragging) return;

    let deltaX = e.clientX - startX;
    let stepDeltaX = e.clientX - lastX;

    if (document.body.classList.contains('force-landscape')) {
      deltaX = e.clientY - startY;
      stepDeltaX = e.clientY - lastX;
    }
    lastX = e.clientX;

    if (dragMode === "fast") {
      const thresholdPixels = 32;
      if (Math.abs(deltaX) > thresholdPixels) {
        const direction = deltaX > 0 ? -1 : 1;
        const potentialTarget = idx + direction;

        if (potentialTarget >= 0 && potentialTarget < pages.length) {
          startX = e.clientX;
          startY = e.clientY;

          currentTargetIdx = potentialTarget;
          updateCounterDisplay(currentTargetIdx);

          flap.className = 'active';
          flap.style.transform = '';

          if (direction === 1) {
            flap.classList.add('anchor-right', 'turbo-finish');
            setBg(flapFrontBg, pages[idx]);
            setBg(flapBackBg, pages[currentTargetIdx]);
            setBg(leafRightBg, pages[currentTargetIdx]);
            flap.getBoundingClientRect();
            flap.style.transform = 'rotateY(-180deg)';
          } else {
            flap.classList.add('anchor-left', 'turbo-finish');
            setBg(flapFrontBg, pages[idx]);
            setBg(flapBackBg, pages[currentTargetIdx]);
            setBg(leafLeftBg, pages[currentTargetIdx]);
            flap.getBoundingClientRect();
            flap.style.transform = 'rotateY(180deg)';
          }

          updateDynamicBackground(currentTargetIdx);
          idx = currentTargetIdx;

          requestAnimationFrame(() => {
            if (!isDragging || dragMode !== "fast") return;
            setIdle(idx);
          });
        }
      }
      return;
    }

    if (currentDir === 0) {
      if (deltaX < -10 && idx < pages.length - 1) {
        currentDir = 1;
        currentTargetIdx = idx + 1;
        flap.className = 'active anchor-right';
        setBg(flapFrontBg, pages[idx]);
        setBg(flapBackBg, pages[currentTargetIdx]);
        setBg(leafRightBg, pages[currentTargetIdx]);
      } else if (deltaX > 10 && idx > 0) {
        currentDir = -1;
        currentTargetIdx = idx - 1;
        flap.className = 'active anchor-left';
        setBg(flapFrontBg, pages[idx]);
        setBg(flapBackBg, pages[currentTargetIdx]);
        setBg(leafLeftBg, pages[currentTargetIdx]);
      }
    }

    if (currentDir !== 0) {
      let progress = -deltaX / (bookWidth / 2);
      if (currentDir === -1) progress = deltaX / (bookWidth / 2);

      progress = Math.max(0, Math.min(1, progress));
      const angle = progress * 180;
      flap.style.transform = `rotateY(${currentDir === 1 ? -angle : angle}deg)`;

      // Map drag position linearly between current page and drag target color
      let currentProgressIndex = idx;
      if (progress > 0.5) {
        currentProgressIndex = currentTargetIdx;
      }
      updateDynamicBackground(currentProgressIndex);
    }
  });

  document.addEventListener('pointerup', (e) => {
    if (!isDragging) return;
    isDragging = false;

    let deltaX = e.clientX - startX;
    if (document.body.classList.contains('force-landscape')) {
      deltaX = e.clientY - startY;
    }

    if (dragMode === "fast") {
      isAnimating = true;
      flap.className = 'smooth-finish';
      flap.style.transform = '';
      setIdle(idx);
      setTimeout(() => {
        flap.className = '';
        isAnimating = false;
      }, 150);
      return;
    }

    if (currentDir === 0) {
      const midPoint = window.innerWidth / 2;
      if (e.clientX >= midPoint) {
        turn(1);
      } else {
        turn(-1);
      }
      return;
    }

    let progress = -deltaX / (bookWidth / 2);
    if (currentDir === -1) progress = deltaX / (bookWidth / 2);

    isAnimating = true;
    flap.classList.add('smooth-finish');

    if (progress > 0.4) {
      updateCounterDisplay(currentTargetIdx);
      flap.style.transform = `rotateY(${currentDir === 1 ? -180 : 180}deg)`;

      if (currentDir === 1) {
        setBg(leafRightBg, pages[currentTargetIdx]);
      } else {
        setBg(leafLeftBg, pages[currentTargetIdx]);
      }

      updateDynamicBackground(currentTargetIdx);

      finishTimeout = setTimeout(() => {
        idx = currentTargetIdx;
        setIdle(idx);
        flap.className = '';
        flap.style.transform = '';
        isAnimating = false;
      }, 400);
    } else {
      flap.style.transform = 'rotateY(0deg)';
      updateCounterDisplay(idx);

      if (currentDir === 1) {
        setBg(leafRightBg, pages[idx]);
      } else {
        setBg(leafLeftBg, pages[idx]);
      }

      updateDynamicBackground(idx);

      finishTimeout = setTimeout(() => {
        setIdle(idx);
        flap.className = '';
        flap.style.transform = '';
        isAnimating = false;
      }, 400);
    }
  });

  document.addEventListener('keydown', e=>{
    if(e.key === 'ArrowRight') turn(1);
    if(e.key === 'ArrowLeft') turn(-1);
  });

  window.addEventListener('resize', applyFallback);
  window.addEventListener('orientationchange', applyFallback);
  applyFallback();

  setIdle(0);
  updateCounterDisplay(0);

  autoLoadAssets().then(loaded => {
    if(loaded) {
      setIdle(0);
      updateCounterDisplay(0);
    }
  });
});
</script>
</body>
</html>
