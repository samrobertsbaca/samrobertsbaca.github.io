  <script src="https://unpkg.com/thru-space@latest"></script>
  <script>
    const canvas = document.querySelector('#fireworks')
    const thruSpace = new ThruSpace(canvas, {
  starsPerPx: 0.00025,
  speedNormal: 0.5,
  speedLight: 15,
  transitionSpeed: 0.2,
  starSize: { min: 1, max: 3 },
  lightSpeedTailLength: 0.3,
  // 💙 Star color section
    starColor: {
      base: [0, 0, 0], // light blue base color
      additional: [
        [0, 180, 255],
        [255,255,255] // deep sky blue
      ],
      mix: { min: 0.3, max: 1 } // blends different blues
    },
  isInitialLightSpeed: true
}).start()
  </script>
