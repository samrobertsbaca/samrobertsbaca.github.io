<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Wheel — Scorsby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a12;
      font-family: 'IBM Plex Mono', monospace;
      cursor: grab;
    }
    body:active { cursor: grabbing; }
    canvas { display: block; position: fixed; top: 0; left: 0; }

    #tooltip {
      position: fixed;
      display: none;
      background: rgba(8, 8, 18, 0.96);
      border: 1px solid rgba(201, 168, 76, 0.6);
      border-radius: 6px;
      padding: 14px 18px;
      max-width: 340px;
      min-width: 180px;
      color: #d4c5a0;
      font-size: 15px;
      line-height: 1.6;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 0 30px rgba(201, 168, 76, 0.25), inset 0 0 20px rgba(201, 168, 76, 0.05);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #tooltip .tooltip-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 6px;
      opacity: 0.8;
    }
    #tooltip .tooltip-text {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      line-height: 1.7;
    }
    #tooltip .tooltip-ring {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: rgba(201, 168, 76, 0.5);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    #info {
      position: fixed;
      top: 24px;
      left: 32px;
      color: #c9a84c;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.6;
      pointer-events: none;
      z-index: 10;
    }

    #hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #d4c5a0;
      font-size: 12px;
      opacity: 0.4;
      font-style: italic;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      transition: opacity 1s ease;
    }

   </style>
</head>
<body>
  <div id="info">Memory Wheel</div>
  <canvas id="wheel"></canvas>
  <div id="tooltip">
    <div class="tooltip-label">Word</div>
    <div class="tooltip-text"></div>
    <div class="tooltip-ring"></div>
  </div>
    <div id="hint">Drag rings to rotate · R: regenerate · Config: itemsPerRing, maxWordLength in memorywheel.js</div>
  <script type="module" src="memorywheel.js"></script>
</body>
</html>
