<!DOCTYPE html>

  <meta charset="utf-8" />
  <title>scorsbyzone</title>
  <style>
    @font-face {
      font-family: 'BodyFont';
      src: url('/fonts/IBMPlexMono-Regular.ttf') format('truetype');
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    /* Stack both canvases in the same spot */
    #c, #p5-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    /* Main Glitch Engine (Bottom Layer) */
    #c {
      z-index: 1;
    }

    /* p5.js Sketch (Top Layer) */
    #p5-container {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2; /* Higher number = on top */
      pointer-events: none; /* Allow mouse clicks to pass through to the snippets below if needed */
    }
  </style>

  <link rel="stylesheet" href="/style.css">
