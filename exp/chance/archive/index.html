<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Albums | Scorsby Records</title>
<meta name="description" content="Impermanence Series A: every album that has existed. Each was heard for one day.">
<link rel="icon" href="../../../scorsbyface.png">
<style>
  :root {
    --page: #B34777;
    --paper: #FDF9F8;
    --text: #00B4FF;
    --link: #EB000E;
    --nav: #100E0E;
    --line: rgba(0, 0, 0, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--page); }
  body { margin: 0; color: #000; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  #centerWrapper { width: 975px; max-width: 100%; margin: 0 auto; }
  /* the header: a blurred strip of the day's cover, the label's name blurred over it */
  #customHeader { position: relative; height: 180px; overflow: hidden; background: #d8a8a0; }
  #customHeader img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #customHeader .name {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 700 64px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -1px;
    color: rgba(255, 255, 255, 0.92); filter: blur(5px);
    text-shadow: 0 0 18px rgba(255, 255, 255, 0.8);
  }
  #band-navbar { background: var(--nav); height: 38px; display: flex; padding: 0 15px; }
  #band-navbar a { color: var(--link); font-weight: 700; font-size: 14px; line-height: 36px; padding: 0 15px; margin-right: 4px;
    border-top: 2px solid transparent; }
  #band-navbar a.active { color: var(--text); border-top-color: var(--text); }
  main { background: var(--paper); color: var(--text); padding: 35px 30px 80px; min-height: 400px; }
  h1 { font-size: 28px; font-weight: 400; margin: 0 0 6px; line-height: 1.05; }
  .sub { font-size: 14px; margin: 0 0 34px; }
  /* the catalogue: Bandcamp's music grid, three across, with nothing to play */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px 30px; }
  .album img { width: 100%; aspect-ratio: 1; display: block; background: #eee; }
  .album .t { font-size: 14px; margin: 8px 0 2px; color: var(--text); line-height: 1.3; }
  .album .t a { color: var(--link); }
  .album .d { font-size: 12px; color: #000; margin: 0 0 8px; }
  .album .d .today { color: var(--link); }
  .album ol { margin: 0; padding: 0; list-style: none; font-size: 11px; line-height: 1.55; color: var(--text); }
  .album li { display: flex; gap: 6px; }
  .album li .n { color: #000; width: 18px; flex: none; text-align: right; }
  .album li .time { color: #000; margin-left: auto; padding-left: 8px; flex: none; }
  .album .cat { font-size: 11px; color: #000; opacity: .6; margin-top: 6px; }
  .empty { font-size: 14px; }
  .back { margin-top: 40px; font-size: 12px; }
  footer { text-align: center; color: rgba(255, 255, 255, .8); font-size: 11px; padding: 18px 0 40px; }
  footer a { color: #fff; }
  @media (max-width: 900px) {
    #customHeader { height: 110px; }
    #customHeader .name { font-size: 38px; }
  }
  /* on phones, as on Bandcamp: the label strip instead of the banner */
  #miniProfile { display: none; }
  @media (max-width: 700px) {
    #customHeader { display: none; }
    #miniProfile { display: flex; align-items: center; height: 59px; padding-left: 16px; background: var(--paper);
      border-bottom: 1px solid var(--line); }
    #miniProfile img { width: 44px; height: 44px; border-radius: 50%; background: #fff; object-fit: contain;
      border: 1px solid var(--line); flex: none; }
    #miniProfile .who { flex: 1; min-width: 0; margin-left: 11px; }
    #miniProfile .nm { font-size: 16px; color: var(--text); }
    #miniProfile .lc { font-size: 14px; color: #000; opacity: .72; }
    #miniProfile .fl { font-size: 16px; padding: 12px 16px; }
    #band-navbar { padding: 0 0 0 16px; overflow-x: auto; scrollbar-width: none; }
    #band-navbar::-webkit-scrollbar { display: none; }
    #band-navbar a { font-size: 16px; padding: 0; margin-right: 22px; white-space: nowrap; flex: none; }
    main { padding: 22px 16px 60px; }
    h1 { font-size: 22px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 26px 16px; }
    .album .t { font-size: 14px; }
    .album .d { font-size: 13px; }
    .album ol { font-size: 12px; }
  }
</style>
</head>
<body>
<div id="centerWrapper">
  <div id="miniProfile">
    <img src="../../../scorsbyface.png" alt="">
    <div class="who"><div class="nm">Scorsby Records</div><div class="lc">Now, Here</div></div>
    <a class="fl" href="https://scorsby.bandcamp.com">follow</a>
  </div>
  <div id="customHeader"><img id="banner" alt=""><div class="name" aria-hidden="true">scorsby records</div></div>
  <nav id="band-navbar">
    <a href="../">music</a>
    <a href="../score/">score</a>
    <a class="active" href="./">past</a>
    <a href="https://scorsby.bandcamp.com/merch">merch</a>
    <a href="https://scorsby.bandcamp.com/community">community</a>
  </nav>
  <main>
    <h1>Impermanence Series A</h1>
    <p class="sub">These albums existed. Each was heard for one day.</p>
    <div class="grid" id="grid"></div>
    <div class="back"><a href="../">&larr; today's album</a></div>
  </main>
  <footer>made by chance &middot; <a href="https://scorsby.us">scorsby.us</a></footer>
</div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const when = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  let today = null;
  // the header is today's album, as on the other pages; and today's album is the one that can still be heard
  const now = fetch('../album.json', { cache: 'no-cache' }).then(r => r.json()).then(a => {
    $('banner').src = /^(https?|data):/.test(a.banner) ? a.banner : '../' + a.banner;
    today = a.catalog || null;
  }).catch(() => {});
  const cards = fetch('index.json', { cache: 'no-cache' }).then(r => r.json());
  Promise.all([now, cards]).then(([, cs]) => {
    if (!cs.length) { $('grid').outerHTML = '<p class="empty">No album has existed yet.</p>'; return; }
    cs.slice().sort((x, y) => y.number - x.number).forEach(c => {   // newest first, as on Bandcamp
      const el = document.createElement('div');
      el.className = 'album';
      const img = document.createElement('img');
      img.src = '../' + c.cover;
      img.alt = c.title;
      img.loading = 'lazy';
      const t = document.createElement('p');
      t.className = 't';
      if (c.catalog === today) {                  // the one album still here
        const a = document.createElement('a');
        a.href = '../';
        a.textContent = c.title;
        t.appendChild(a);
      } else {
        t.textContent = c.title;
      }
      const d = document.createElement('p');
      d.className = 'd';
      d.textContent = when(c.day) + ' · ' + fmt(c.length);
      if (c.catalog === today) {
        const s = document.createElement('span');
        s.className = 'today';
        s.textContent = ' · today';
        d.appendChild(s);
      }
      const ol = document.createElement('ol');
      c.tracks.forEach(tr => {
        const li = document.createElement('li');
        const n = document.createElement('span'); n.className = 'n'; n.textContent = tr.n + '.';
        const nm = document.createElement('span'); nm.textContent = tr.title;
        const tm = document.createElement('span'); tm.className = 'time'; tm.textContent = fmt(tr.duration);
        li.append(n, nm, tm);
        ol.appendChild(li);
      });
      const cat = document.createElement('div');
      cat.className = 'cat';
      cat.textContent = c.catalog + (c.pure ? ' · a truly random day' : '') + (c.last ? ' · the last' : '');
      el.append(img, t, d, ol, cat);
      $('grid').appendChild(el);
    });
  }).catch(() => { $('grid').outerHTML = '<p class="empty">The catalogue could not be read.</p>'; });
})();
</script>
</body>
</html>
